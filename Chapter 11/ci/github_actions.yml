# Chapter 11 — KYC Evaluation Harness CI Configuration
#
# After installation, emits kyc-eval-required on every PR. Evaluation runs
# for Chapter 11/workflow changes. Configure the final gate as required.

name: kyc-eval

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python "Chapter 11/ci/change_scope.py"

  scorecard:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Chapter 11

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Chapter 11/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run evaluation harness
        env:
          KYC_AGENT_VERSION: ${{ github.sha }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m src.eval_harness.run \
            --segment all \
            --output scorecard.json \
            --markdown scorecard.md \
            --executor "github-actions:${{ github.run_id }}"

      - name: Upload scorecard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyc-scorecard
          path: |
            Chapter 11/scorecard.json
            Chapter 11/scorecard.md

      - name: Generate model risk report
        if: always()
        run: |
          python -m src.reporting.model_risk_report scorecard.json \
            --out model_risk_report.md

      - name: Upload model risk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-risk-report
          path: Chapter 11/model_risk_report.md

  required:
    name: kyc-eval-required
    needs: [changes, scorecard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check evaluation outcome
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          SCORECARD_RESULT: ${{ needs.scorecard.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$RELEVANT" = true ]; then
            test "$SCORECARD_RESULT" = success
          else
            test "$RELEVANT" = false
            test "$SCORECARD_RESULT" = skipped
          fi
